services:
  mc:
    # Minecraft 1.19.4/Fabric's Mixin stack is not compatible with Java 25.
    image: itzg/minecraft-server:java17
    container_name: odyssey-mc
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.19.4"
      FABRIC_LOADER_VERSION: "0.15.11"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ALLOW_FLIGHT: "TRUE"
      MAX_MEMORY: "8G"
      INIT_MEMORY: "4G"
      VIEW_DISTANCE: "1"
      SIMULATION_DISTANCE: "4"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "50"
      # OPS=name resolves an online UUID even when ONLINE_MODE is false.
      # Use the deterministic OfflinePlayer:bot UUID so a fresh world can run
      # the E0 hard-reset commands on the bot's first connection.
      OPS_FILE: "/config/mineskynet-ops.json"
      OVERRIDE_OPS: "TRUE"
    volumes:
      - ./runtime/minecraft/data:/data
      - ./runtime/minecraft/mods:/mods:ro
      - ./server-profile/e0/ops.json:/config/mineskynet-ops.json:ro
    restart: unless-stopped
